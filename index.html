<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>思茅一中 · 校园论坛</title>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-soft:#eff6ff;
  --bg:#f1f5f9;--text:#0f172a;--sub:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--card:#fff;--danger:#ef4444;--star:#f59e0b;--ok:#16a34a;
  --radius:16px;--shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#f8fafc,#eef2f7);color:var(--text);min-height:100vh;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hide{display:none!important}
header{position:fixed;top:0;left:0;width:100%;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.85)}
.nav{max-width:1200px;margin:auto;min-height:64px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;white-space:nowrap}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 5px 14px rgba(37,99,235,.25)}
.logo small{font-size:12px;color:var(--muted);font-weight:500}
.nav-right{display:flex;align-items:center;gap:15px}
.nav-menu{display:flex;gap:20px}
.nav-link{border:0;background:none;color:var(--sub);font-size:14px;font-weight:600;padding:7px 2px;position:relative}
.nav-link.active{color:var(--primary)}
.nav-link.active:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2px;border-radius:2px;background:var(--primary)}
.user-chip{border:1px solid var(--border);background:#fff;border-radius:22px;padding:5px 11px 5px 5px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.user-chip .av{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);font-size:16px}
.admin-badge{font-size:10px;color:#fff;background:#d97706;border-radius:9px;padding:2px 6px;margin-left:2px}
.container{max-width:1200px;margin:84px auto 35px;padding:0 20px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}
.sidebar{position:sticky;top:84px;height:max-content;background:#fff;border:1px solid rgba(226,232,240,.75);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sidebar-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em;margin:2px 8px 10px}
.side-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;color:var(--sub);font-size:14px;font-weight:600;margin-bottom:3px;border:0;background:none;width:100%;text-align:left}
.side-item:hover{background:#f8fafc}.side-item.active{background:var(--primary-soft);color:var(--primary)}
.sidebar-tip{margin-top:14px;padding:12px;border-radius:11px;background:#f8fafc;color:var(--muted);font-size:12px;line-height:1.55}
.main-box{min-width:0}
.card{background:var(--card);border:1px solid rgba(226,232,240,.75);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.publish-card{margin-bottom:16px}
textarea{width:100%;min-height:92px;border:0;outline:0;resize:vertical;background:transparent;color:var(--text);font-size:16px;line-height:1.65}
textarea::placeholder{color:#a8b2c1}
.divider{height:1px;background:var(--border);margin:10px 0 12px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.select,.search-input{border:1px solid var(--border);background:#fff;color:var(--sub);border-radius:10px;outline:0;padding:8px 11px;font-size:13px}
.select:focus,.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.upload{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border:1px dashed #cbd5e1;background:#f8fafc;color:var(--sub);border-radius:10px;font-size:13px;font-weight:600}
.upload:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.hidden-file{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}
.anon{display:flex;align-items:center;gap:6px;padding:7px 8px;color:var(--sub);font-size:13px}
.anon input{accent-color:var(--primary)}
.primary-btn{margin-left:auto;border:0;color:#fff;background:linear-gradient(135deg,#2563eb,#1d4ed8);padding:9px 18px;border-radius:10px;font-size:14px;font-weight:700;box-shadow:0 4px 12px rgba(37,99,235,.22)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,.3)}
.preview-list{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.preview{width:72px;height:72px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--border);background:#f1f5f9}
.preview img{width:100%;height:100%;object-fit:cover}
.remove-img{position:absolute;right:4px;top:4px;width:21px;height:21px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;line-height:1}
.feed-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.feed-title{font-size:14px;font-weight:800;flex:1}
.search-wrap{position:relative;flex:1;max-width:270px}
.search-input{width:100%;padding-left:34px}
.search-icon{position:absolute;left:11px;top:7px;color:var(--muted);font-size:14px}
.sort-btn{border:1px solid var(--border);background:#fff;color:var(--sub);padding:8px 10px;border-radius:9px;font-size:12px;font-weight:600}
.notice{padding:14px 16px;border-radius:13px;background:linear-gradient(135deg,#eff6ff,#f8fbff);border:1px solid #dbeafe;margin-bottom:16px}
.notice strong{color:var(--primary);font-size:13px}.notice p{font-size:13px;color:var(--sub);margin-top:3px}
.post-card{margin-bottom:16px;transition:.2s}
.post-card:hover{box-shadow:0 8px 28px rgba(15,23,42,.09)}
.post-card.pinned{border-color:#bfdbfe;box-shadow:0 4px 22px rgba(37,99,235,.08)}
.post-head{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e0e7ff,#c7d2fe);font-size:22px;flex-shrink:0}
.post-user{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-time{font-size:12px;color:var(--muted)}
.post-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.tag-bagua{background:#fef2f2;color:#dc2626}.tag-love{background:#fdf4ff;color:#c026d3}.tag-news{background:#f0fdf4;color:#16a34a}
.pin{font-size:11px;font-weight:700;color:#2563eb;background:#eff6ff;border-radius:20px;padding:3px 9px}
.post-content{font-size:15px;color:var(--sub);line-height:1.75;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.image-grid{display:grid;gap:6px;margin:8px 0 14px}
.image-grid.c1{grid-template-columns:minmax(0,320px)}.image-grid.c2{grid-template-columns:repeat(2,minmax(0,210px))}.image-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.image-item{aspect-ratio:1;overflow:hidden;border-radius:11px;background:#f1f5f9;cursor:zoom-in}
.image-item img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}.image-item:hover img{transform:scale(1.05)}
.actions{border-top:1px solid #f1f5f9;padding-top:10px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.action{border:0;background:none;color:var(--sub);padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600}
.action:hover{background:#f8fafc;color:var(--primary)}.action.like-on{color:var(--danger);background:#fef2f2}.action.fav-on{color:var(--star);background:#fffbeb}
.action.delete{margin-left:auto;color:var(--muted)}.action.delete:hover{color:var(--danger);background:#fef2f2}
.comment-area{margin-top:12px;padding-top:12px;border-top:1px solid #f1f5f9}
.comment{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid #f8fafc}
.comment:last-of-type{border-bottom:0}.comment-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f1f5f9;flex-shrink:0}
.comment-body{min-width:0;flex:1}.comment-head{display:flex;align-items:center;gap:6px}.comment-head strong{font-size:13px;color:var(--primary)}.comment-head span{font-size:11px;color:var(--muted)}
.comment-del{margin-left:auto;border:0;background:none;color:var(--muted);font-size:11px;padding:3px 6px;border-radius:5px}.comment-del:hover{color:var(--danger);background:#fef2f2}
.comment-text{font-size:13px;color:var(--sub);margin-top:2px;word-break:break-word}
.comment-img{margin-top:6px;max-width:190px;border-radius:9px;overflow:hidden;cursor:zoom-in}.comment-img img{width:100%;display:block}
.comment-preview{display:flex;gap:7px;margin:7px 0;flex-wrap:wrap}.comment-preview .preview{width:58px;height:58px}
.comment-input-row{display:flex;gap:7px;align-items:center;margin-top:10px}
.comment-photo{width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:9px;display:grid;place-items:center;color:var(--sub)}
.comment-input{flex:1;min-width:0;border:1px solid var(--border);background:#f8fafc;border-radius:9px;padding:9px 12px;outline:0;font-size:13px}
.comment-input:focus{background:#fff;border-color:var(--primary)}.comment-send{border:0;background:var(--primary);color:#fff;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}.empty .emoji{font-size:38px;display:block;margin-bottom:10px}
.my-page{background:#fff;border:1px solid rgba(226,232,240,.75);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.my-info{display:flex;align-items:center;gap:15px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.my-info .avatar{width:62px;height:62px;font-size:30px}.my-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.mini{border:1px solid var(--border);background:#fff;color:var(--sub);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}.mini:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}.mini.admin{background:#d97706;color:#fff;border-color:#d97706}
.tabs{display:flex;gap:5px;background:#f1f5f9;padding:4px;border-radius:11px;margin-bottom:18px;overflow:auto}.tab{white-space:nowrap;border:0;background:none;color:var(--sub);padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600}.tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(15,23,42,.08)}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:100%;max-width:410px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 60px rgba(15,23,42,.22)}
.modal h3{font-size:18px;margin-bottom:5px}.tip{font-size:12px;color:var(--muted);margin-bottom:14px}.modal input[type=text],.modal input[type=password]{width:100%;border:1px solid var(--border);background:#f8fafc;border-radius:10px;padding:11px 13px;outline:0;margin-bottom:8px}.modal input:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.status{min-height:18px;color:var(--muted);font-size:12px;margin-bottom:12px}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.avatars{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.avatar-choice{width:42px;height:42px;border:2px solid transparent;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;font-size:21px}.avatar-choice.selected{border-color:var(--primary);background:var(--primary-soft)}
.modal-actions{display:flex;gap:8px}.secondary{flex:1;border:1px solid var(--border);background:#fff;color:var(--sub);border-radius:10px;padding:10px;font-size:13px;font-weight:600}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:grid;place-items:center;padding:18px;cursor:zoom-out}.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(15,23,42,.93);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px 20px}
.mobile-nav{display:none}
@media(max-width:768px){
  header{position:fixed}.nav{min-height:58px;padding:8px 13px}.logo{font-size:15px}.logo-mark{width:30px;height:30px}.logo small{display:none}
  .nav-menu{display:none}.user-chip{font-size:12px;padding-right:8px}.container{display:block;margin:74px auto 75px;padding:0 12px}
  .sidebar{position:static;padding:8px;margin-bottom:12px;display:flex;gap:5px;overflow-x:auto;box-shadow:none}.sidebar-title,.sidebar-tip{display:none}.side-item{width:auto;flex:0 0 auto;margin:0;padding:8px 11px;font-size:12px;white-space:nowrap}
  .card{padding:16px;border-radius:14px}.publish-card{padding:15px}.publish-card textarea{min-height:82px}
  .toolbar{gap:6px}.upload,.select,.anon{font-size:12px}.primary-btn{width:100%;margin-left:0;margin-top:2px;padding:10px}
  .feed-tools{flex-wrap:wrap}.search-wrap{order:3;flex-basis:100%;max-width:none}.feed-title{font-size:13px}
  .image-grid.c3{grid-template-columns:repeat(3,1fr)}.image-grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .post-content{font-size:14px}.actions{gap:2px}.action{padding:7px 8px;font-size:12px}
  .comment-input-row{align-items:stretch}.comment-photo{width:36px}.comment-send{padding:8px 11px}
  .my-page{padding:16px}.my-info .avatar{width:55px;height:55px;font-size:26px}.my-actions{width:100%;margin-left:0}.my-actions .mini{flex:1}
  .tabs{margin-left:-2px;margin-right:-2px}.tab{padding:8px 11px}
  .mobile-nav{position:fixed;display:flex;left:0;right:0;bottom:0;z-index:90;padding:7px 12px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--border);justify-content:space-around}
  .mobile-nav button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;padding:4px 18px}.mobile-nav button.active{color:var(--primary)}
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo"><span class="logo-mark">思</span>思茅一中 · 校园论坛 <small>文庙论坛</small></div>
    <div class="nav-right">
      <div class="nav-menu">
        <button class="nav-link active" data-nav="home">首页</button>
        <button class="nav-link" data-nav="my">我的</button>
      </div>
      <button class="user-chip" id="userChip"><span class="av" id="chipAvatar">😀</span><span id="chipNick">同学</span></button>
    </div>
  </div>
</header>

<input type="file" id="postImageInput" accept="image/*" multiple class="hidden-file">

<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">板块分类</div>
    <button class="side-item active" data-cat="all">🔥 全部动态</button>
    <button class="side-item" data-cat="bagua">🍉 校园八卦</button>
    <button class="side-item" data-cat="love">💌 表白墙</button>
    <button class="side-item" data-cat="news">📢 校园新鲜事</button>
    <div class="sidebar-tip">💡 文庙论坛是校园交流测试版。请友善发言，不发布真实姓名、电话、住址等个人信息。</div>
  </aside>

  <main class="main-box">
    <section id="homePage">
      <div class="notice">
        <strong>📢 文庙论坛公告</strong>
        <p>欢迎来到思茅一中校园论坛！帖子、评论、点赞和收藏通过 Supabase 共享，换设备也能继续使用。</p>
      </div>

      <div class="card publish-card">
        <textarea id="textVal" maxlength="2000" placeholder="分享你的校园心事、八卦、表白或新鲜事……"></textarea>
        <div class="divider"></div>
        <div id="postPreviewList" class="preview-list"></div>
        <div class="toolbar" style="margin-top:10px">
          <label class="upload" for="postImageInput">📷 添加图片</label>
          <select class="select" id="catSelect">
            <option value="bagua">校园八卦</option>
            <option value="love">表白墙</option>
            <option value="news">校园新鲜事</option>
          </select>
          <label class="anon"><input type="checkbox" id="anonCheck"> 匿名发布</label>
          <span id="charCount" style="font-size:11px;color:var(--muted)">0 / 2000</span>
          <button class="primary-btn" id="publishBtn">发布动态</button>
        </div>
      </div>

      <div class="feed-tools">
        <div class="feed-title" id="feedTitle">全部动态</div>
        <div class="search-wrap"><span class="search-icon">🔍</span><input class="search-input" id="searchInput" placeholder="搜索帖子内容或昵称…"></div>
        <button class="sort-btn" id="sortBtn">最新优先 ↕</button>
      </div>
      <div id="postList"></div>
    </section>

    <section id="myPage" class="hide">
      <div class="my-page">
        <div class="my-info">
          <div class="avatar" id="myAvatar">😀</div>
          <div><div style="font-size:19px;font-weight:800" id="myNick">同学</div><div style="font-size:12px;color:var(--muted)" id="myRole">思茅一中 · 在校学生</div></div>
          <div class="my-actions">
            <button class="mini" id="editProfileBtn">修改资料</button>
            <button class="mini" id="adminEntryBtn">🔐 管理员</button><button class="mini" id="aboutBtn">🏫 关于我们</button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="posts">我的帖子</button>
          <button class="tab" data-tab="comments">我的评论</button>
          <button class="tab" data-tab="likes">❤️ 我的点赞</button>
          <button class="tab" data-tab="favorites">⭐ 我的收藏</button>
        </div>
        <div id="myContentList"></div>
      </div>
    </section>
  </main>
</div>

<nav class="mobile-nav">
  <button data-nav="home" class="active">🏠<br>首页</button>
  <button id="mobileUserBtn">👤<br>资料</button>
  <button data-nav="my">📋<br>我的</button>
</nav>

<footer>文庙论坛 · 云南省思茅一中校园社区<br><span style="letter-spacing:2px">求真 · 共学 · 同行</span></footer>

<div class="modal-mask hide" id="userModal">
  <div class="modal">
    <h3>修改昵称与头像</h3>
    <div class="tip">昵称仅保存在当前浏览器中。静态测试版不会上传到服务器。</div>
    <input type="text" id="nickInput" maxlength="20" autocomplete="off" placeholder="输入昵称">
    <div class="status" id="nickStatus">请输入昵称</div>
    <div class="avatars" id="avatarSelect">
      <button class="avatar-choice" data-avatar="😀">😀</button><button class="avatar-choice" data-avatar="😎">😎</button>
      <button class="avatar-choice" data-avatar="🥳">🥳</button><button class="avatar-choice" data-avatar="🤓">🤓</button>
      <button class="avatar-choice" data-avatar="😜">😜</button><button class="avatar-choice" data-avatar="🤗">🤗</button>
      <button class="avatar-choice" data-avatar="😏">😏</button><button class="avatar-choice" data-avatar="🥰">🥰</button>
      <button class="avatar-choice" data-avatar="🤠">🤠</button>
    </div>
    <div class="modal-actions"><button class="secondary" id="cancelUser">关闭</button><button class="primary-btn" style="margin:0;flex:1" id="saveUserBtn">保存</button></div>
  </div>
</div>

<div class="modal-mask hide" id="adminModal">
  <div class="modal">
    <h3>👑 管理员</h3>
    <div class="tip" id="adminTip">管理员身份由 Supabase 服务器权限控制，不在网页中保存管理员密码。</div>
    <div class="status" id="adminStatus">正在读取管理员状态……</div>
    <div class="modal-actions"><button class="secondary" id="cancelAdmin">关闭</button></div>
  </div>
</div>

<div class="lightbox hide" id="lightbox"><img id="lightboxImg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://pjfwkylyeiaymwajtztt.supabase.co';
const SUPABASE_KEY='sb_publishable_WfdLfZvV9z4eccE30RL0Ww_3Bkjmsl4';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null,currentProfile=null,allProfiles=[];
let posts=[],comments=[],likes=[],favorites=[];
let currentCategory='all',myTab='posts',sortMode='new',searchText='';
let pendingPostImages=[],pendingCommentImages={};

const $=id=>document.getElementById(id);
const toast=msg=>{const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2100)};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtTime(ts){const d=new Date(ts),now=new Date(),sec=Math.max(0,Math.floor((now-d)/1000));if(sec<30)return '刚刚';if(sec<60)return sec+'秒前';if(sec<3600)return Math.floor(sec/60)+'分钟前';if(sec<86400)return Math.floor(sec/3600)+'小时前';if(sec<2592000)return Math.floor(sec/86400)+'天前';return d.toLocaleString('zh-CN',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function catInfo(cat){
  const map={bagua:{name:'校园八卦',cls:'tag-bagua'},love:{name:'表白墙',cls:'tag-love'},news:{name:'校园新鲜事',cls:'tag-news'},校园:{name:'校园',cls:'tag-news'},学习:{name:'学习',cls:'tag-news'},生活:{name:'生活',cls:'tag-news'},吐槽:{name:'吐槽',cls:'tag-bagua'},求助:{name:'求助',cls:'tag-news'},'失物招领':{name:'失物招领',cls:'tag-news'}};
  return map[cat]||map.news;
}
function avatarFor(id){return allProfiles.find(p=>p.id===id)?.avatar||'😀'}
function profileFor(id){return allProfiles.find(p=>p.id===id)||null}
function displayName(id,anonymous=false){if(anonymous)return '匿名同学';return profileFor(id)?.nickname||'同学';}
function adminFlag(id){return !!profileFor(id)?.is_admin}
function relativeRefresh(){renderPosts();renderMyPage();}

let initRetryUsed=false;
let debugBox=null;
function errorText(e){
  if(!e)return '未知错误';
  const parts=[e.message,e.code,e.status,e.details,e.hint].filter(v=>v!==undefined&&v!==null&&String(v)!=='');
  return parts.length?parts.join(' · '):String(e);
}
function showDebugError(stage,e){
  const msg=errorText(e);
  console.error('[论坛连接失败]',stage,e);
  toast('连接失败：'+stage);
  if(!debugBox){
    debugBox=document.createElement('div');
    debugBox.style.cssText='position:fixed;left:14px;right:14px;bottom:14px;z-index:99999;background:#fff;border:1px solid #fecaca;border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:14px;color:#334155;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
    document.body.appendChild(debugBox);
  }
  debugBox.innerHTML='<b style="color:#dc2626">论坛连接失败</b><div style="margin-top:6px"><b>出错位置：</b>'+esc(stage)+'</div><div style="margin-top:4px;word-break:break-word"><b>详细信息：</b>'+esc(msg)+'</div><div style="margin-top:8px;color:#64748b;font-size:12px">请把这段“详细信息”截图发给我，我就能继续定位。页面样式和数据库数据不会因此改变。</div>';
}
async function retryable(fn,label,retries=2){
  let last;
  for(let i=0;i<=retries;i++){
    try{return await fn();}
    catch(e){
      last=e;
      if(i<retries) await new Promise(r=>setTimeout(r,700*(i+1)));
    }
  }
  const e=new Error(label+'：'+errorText(last));
  e.original=last;
  e.stage=label;
  throw e;
}
async function getOrCreateSession(){
  const result=await client.auth.getSession();
  if(result.error)throw result.error;
  let session=result.data?.session;
  if(!session){
    const r=await client.auth.signInAnonymously();
    if(r.error)throw r.error;
    session=r.data?.session;
  }
  if(!session?.user)throw new Error('没有获得有效的登录 Session');
  return session;
}
async function init(){
  try{
    let session=await retryable(getOrCreateSession,'匿名登录 / Session',2);
    currentUser=session.user;
    try{
      await retryable(createOrLoadProfile,'读取个人资料',2);
    }catch(profileError){
      const raw=profileError.original||profileError;
      const status=raw?.status||raw?.code;
      if(!initRetryUsed && (status===401||status===403||String(raw?.code||'').toLowerCase().includes('jwt'))){
        initRetryUsed=true;
        await client.auth.signOut({scope:'local'});
        session=await retryable(getOrCreateSession,'重新匿名登录',2);
        currentUser=session.user;
        await retryable(createOrLoadProfile,'重新读取个人资料',2);
      }else throw profileError;
    }
    await retryable(loadAllData,'加载论坛数据',2);
    bindEvents();
    updateUserUI();
    renderPosts();
    renderMyPage();
    setInterval(relativeRefresh,30000);
  }catch(e){
    showDebugError(e.stage||'初始化论坛',e.original||e);
  }
}

async function createOrLoadProfile(){
  const {data,error}=await client.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  if(error){console.error(error);throw error;}
  currentProfile=data;
  if(!currentProfile) throw new Error('profile 不存在：当前匿名用户没有对应的 profiles 记录');
}
async function loadAllData(){
  await loadProfiles();
  await loadPosts();
  await loadComments();
  await loadLikes();
  await loadFavorites();
}
async function loadProfiles(){const {data,error}=await client.from('profiles').select('id,nickname,avatar,is_admin');if(error){error.stage='读取 profiles';throw error;}allProfiles=data||[];currentProfile=allProfiles.find(p=>p.id===currentUser.id)||currentProfile;}
async function loadPosts(){const {data,error}=await client.from('posts').select('*').order('created_at',{ascending:false});if(error){error.stage='读取 posts';throw error;}posts=data||[];}
async function loadComments(){const {data,error}=await client.from('comments').select('*').order('created_at',{ascending:true});if(error){error.stage='读取 comments';throw error;}comments=data||[];}
async function loadLikes(){const {data,error}=await client.from('post_likes').select('post_id,user_id,created_at');if(error){error.stage='读取 post_likes';throw error;}likes=data||[];}
async function loadFavorites(){const {data,error}=await client.from('post_favorites').select('post_id,user_id,created_at');if(error){error.stage='读取 post_favorites';throw error;}favorites=data||[];}

function updateUserUI(){
  const av=currentProfile?.avatar||'😀',nick=currentProfile?.nickname||'同学';
  $('chipAvatar').textContent=av;$('chipNick').textContent=nick;$('myAvatar').textContent=av;$('myNick').textContent=nick;
  $('myRole').innerHTML=currentProfile?.is_admin?'思茅一中 · <b style="color:#d97706">管理员</b>':'思茅一中 · 在校学生';
  $('adminEntryBtn').textContent=currentProfile?.is_admin?'👑 管理员':'🔐 管理员';
  $('adminEntryBtn').classList.toggle('admin',!!currentProfile?.is_admin);
}

function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>switchPage(b.dataset.nav));
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{currentCategory=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===currentCategory));switchPage('home');renderPosts();});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{myTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderMyPage();});
  $('userChip').onclick=openUser;$('mobileUserBtn').onclick=openUser;$('editProfileBtn').onclick=openUser;$('saveUserBtn').onclick=saveProfile;$('cancelUser').onclick=closeUser;
  document.querySelectorAll('.avatar-choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.avatar-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
  const aboutBtn = $('aboutBtn'); const aboutModal = $('aboutModal'); const closeAbout = $('closeAbout'); if(aboutBtn && aboutModal) aboutBtn.onclick=()=>aboutModal.classList.remove('hide'); if(closeAbout && aboutModal) closeAbout.onclick=()=>aboutModal.classList.add('hide');
  $('adminEntryBtn').onclick=openAdmin;$('cancelAdmin').onclick=closeAdmin;
  $('publishBtn').onclick=publishPost;$('postImageInput').onchange=handlePostImages;$('textVal').oninput=()=>$('charCount').textContent=$('textVal').value.length+' / 2000';
  $('searchInput').oninput=e=>{searchText=e.target.value.trim().toLowerCase();renderPosts()};
  $('sortBtn').onclick=()=>{sortMode=sortMode==='new'?'hot':'new';$('sortBtn').textContent=sortMode==='new'?'最新优先 ↕':'最热优先 ↕';renderPosts()};
  $('lightbox').onclick=()=>$('lightbox').classList.add('hide');
}

function openUser(){if(!currentProfile)return;$('nickInput').value=currentProfile.nickname||'';$('nickStatus').textContent='当前昵称：'+(currentProfile.nickname||'');document.querySelectorAll('.avatar-choice').forEach(b=>b.classList.toggle('selected',b.dataset.avatar===currentProfile.avatar));$('userModal').classList.remove('hide');}
function closeUser(){$('userModal').classList.add('hide')}
async function saveProfile(){
  const n=$('nickInput').value.trim();if(!n){$('nickStatus').textContent='⚠️ 昵称不能为空';$('nickStatus').className='status err';return}
  const a=document.querySelector('.avatar-choice.selected')?.dataset.avatar||currentProfile.avatar;
  const {data,error}=await client.from('profiles').update({nickname:n,avatar:a}).eq('id',currentUser.id).select('*').single();
  if(error){$('nickStatus').textContent='保存失败：'+error.message;$('nickStatus').className='status err';return;}
  currentProfile=data;const i=allProfiles.findIndex(x=>x.id===data.id);if(i>=0)allProfiles[i]=data;else allProfiles.push(data);updateUserUI();renderPosts();renderMyPage();closeUser();toast('资料已保存');
}
function openAdmin(){
  $('adminModal').classList.remove('hide');
  if(currentProfile?.is_admin){$('adminStatus').textContent='✅ 当前账号已具备管理员权限，可以删除全站帖子和评论。';$('adminStatus').className='status ok';$('adminTip').textContent='管理员权限由数据库控制。';}
  else{$('adminStatus').textContent='当前账号不是管理员。';$('adminStatus').className='status';$('adminTip').textContent='管理员身份由 Supabase 数据库字段 is_admin 控制，不在网页中保存管理员密码。';}
}
function closeAdmin(){$('adminModal').classList.add('hide')}

async function compressImage(file,max=1000,quality=.72){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function handlePostImages(e){let added=0;for(const f of e.target.files){if(pendingPostImages.length>=9){toast('一条帖子最多 9 张图片');break}try{pendingPostImages.push(await compressImage(f));added++}catch{}}e.target.value='';renderPostPreview();if(added)toast('已添加 '+added+' 张图片')}
function renderPostPreview(){$('postPreviewList').innerHTML=pendingPostImages.map((s,i)=>`<div class="preview"><img src="${s}"><button class="remove-img" data-i="${i}">×</button></div>`).join('');$('postPreviewList').querySelectorAll('.remove-img').forEach(b=>b.onclick=()=>{pendingPostImages.splice(+b.dataset.i,1);renderPostPreview()})}

async function publishPost(){
  const content=$('textVal').value.trim(),category=$('catSelect').value,anonymous=$('anonCheck').checked;
  if(!content){toast('请输入文字内容');return}
  $('publishBtn').disabled=true;
  try{
    const {error}=await client.from('posts').insert({author_id:currentUser.id,category,content:content||'',images:pendingPostImages,anonymous});
    if(error)throw error;
    $('textVal').value='';$('charCount').textContent='0 / 2000';$('anonCheck').checked=false;pendingPostImages=[];renderPostPreview();await loadAllData();renderPosts();toast('发布成功');
  }catch(e){console.error(e);toast('发布失败：'+e.message)}finally{$('publishBtn').disabled=false}
}

function postStats(id){const pLikes=likes.filter(x=>x.post_id===id).length,pFav=favorites.filter(x=>x.post_id===id).length,pCom=comments.filter(x=>x.post_id===id).length;return {likes:pLikes,favorites:pFav,comments:pCom,score:pLikes+pFav+pCom};}
function isLiked(id){return likes.some(x=>x.post_id===id&&x.user_id===currentUser.id)}
function isFav(id){return favorites.some(x=>x.post_id===id&&x.user_id===currentUser.id)}
function canDeletePost(p){return p.author_id===currentUser.id||!!currentProfile?.is_admin}
function canDeleteComment(c){return c.author_id===currentUser.id||!!currentProfile?.is_admin}

function filteredPosts(){
  let arr=posts.filter(p=>currentCategory==='all'||p.category===currentCategory);
  if(searchText)arr=arr.filter(p=>(p.content||'').toLowerCase().includes(searchText)||displayName(p.author_id).toLowerCase().includes(searchText));
  arr.sort((a,b)=>sortMode==='new'?new Date(b.created_at)-new Date(a.created_at):postStats(b.id).score-postStats(a.id).score||new Date(b.created_at)-new Date(a.created_at));
  return arr;
}
function renderPosts(){
  const names={all:'全部动态',bagua:'校园八卦',love:'表白墙',news:'校园新鲜事',校园:'校园',学习:'学习',生活:'生活',吐槽:'吐槽',求助:'求助','失物招领':'失物招领'};$('feedTitle').textContent=names[currentCategory]||'全部动态';
  const arr=filteredPosts();$('postList').innerHTML=arr.length?arr.map(postHtml).join(''):'<div class="empty"><span class="emoji">📝</span>这里还没有动态</div>';bindFeed();
}
function imageGrid(images){if(!images?.length)return '';return `<div class="image-grid c${Math.min(images.length,3)}">${images.map((s,i)=>`<div class="image-item" data-lightbox="${esc(s)}"><img src="${s}" alt="图片 ${i+1}"></div>`).join('')}</div>`}
function postHtml(p){
  const st=postStats(p.id),liked=isLiked(p.id),fav=isFav(p.id),me=p.author_id===currentUser.id,prof=profileFor(p.author_id),name=displayName(p.author_id,p.anonymous),av=prof?.avatar||'😀',admin=!!p.is_admin;
  const cs=comments.filter(c=>c.post_id===p.id);
  return `<article class="card post-card ${p.is_admin?'pinned':''}"><div class="post-head"><div class="avatar">${esc(av)}</div><div style="min-width:0;flex:1"><div class="post-user">${esc(name)} ${admin?'<span class="admin-badge">管理员</span>':''}</div><div class="post-time">${fmtTime(p.created_at)}</div></div></div><div class="post-meta"><span class="tag ${catInfo(p.category).cls}">${catInfo(p.category).name}</span>${p.is_admin?'<span class="pin">👑 管理员发布</span>':''}</div><div class="post-content">${esc(p.content)}</div>${imageGrid(p.images)}<div class="actions"><button class="action ${liked?'like-on':''}" data-act="like" data-id="${p.id}">${liked?'❤️':'♡'} 点赞 ${st.likes}</button><button class="action ${fav?'fav-on':''}" data-act="fav" data-id="${p.id}">${fav?'⭐':'☆'} 收藏 ${st.favorites}</button><button class="action" data-act="comment" data-id="${p.id}">💬 评论 ${st.comments}</button>${(me||currentProfile?.is_admin)?`<button class="action delete" data-act="delete" data-id="${p.id}">🗑️ 删除</button>`:''}</div><div class="comment-area">${cs.map(commentHtml).join('')}<div class="comment-preview" id="cp-${p.id}"></div><div class="comment-input-row"><button class="comment-photo" data-act="photo" data-id="${p.id}">📷</button><input type="file" accept="image/*" multiple class="hidden-file cinput-file" data-id="${p.id}"><input class="comment-input" id="ci-${p.id}" maxlength="2000" placeholder="写下你的评论…"><button class="comment-send" data-act="sendcomment" data-id="${p.id}">发送</button></div></div></article>`;
}
function commentHtml(c){const prof=profileFor(c.author_id),name=displayName(c.author_id),av=prof?.avatar||'😀';return `<div class="comment"><div class="comment-avatar">${esc(av)}</div><div class="comment-body"><div class="comment-head"><strong>${esc(name)}</strong>${c.is_admin?'<span class="admin-badge">管理员</span>':''}<span>${fmtTime(c.created_at)}</span>${canDeleteComment(c)?`<button class="comment-del" data-act="delcomment" data-cid="${c.id}">删除</button>`:''}</div><div class="comment-text">${esc(c.content)}</div>${(c.images||[]).map(s=>`<div class="comment-img" data-lightbox="${esc(s)}"><img src="${s}" alt="评论图片"></div>`).join('')}</div></div>`}

function bindFeed(){
  document.querySelectorAll('[data-lightbox]').forEach(e=>e.onclick=()=>openLightbox(e.dataset.lightbox));
  document.querySelectorAll('[data-act="like"]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.id));
  document.querySelectorAll('[data-act="fav"]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.id));
  document.querySelectorAll('[data-act="delete"]').forEach(b=>b.onclick=()=>deletePost(b.dataset.id));
  document.querySelectorAll('[data-act="sendcomment"]').forEach(b=>b.onclick=()=>sendComment(b.dataset.id));
  document.querySelectorAll('[data-act="photo"]').forEach(b=>b.onclick=()=>document.querySelector(`.cinput-file[data-id="${b.dataset.id}"]`).click());
  document.querySelectorAll('.cinput-file').forEach(inp=>inp.onchange=async function(){const id=this.dataset.id;pendingCommentImages[id]=pendingCommentImages[id]||[];for(const f of this.files){if(pendingCommentImages[id].length>=3)break;try{pendingCommentImages[id].push(await compressImage(f,800,.72))}catch{}}this.value='';renderCommentPreview(id)});
  document.querySelectorAll('[data-act="delcomment"]').forEach(b=>b.onclick=()=>deleteComment(b.dataset.cid));
}
function renderCommentPreview(id){const e=$('cp-'+id);if(!e)return;const a=pendingCommentImages[id]||[];e.innerHTML=a.map((s,i)=>`<div class="preview"><img src="${s}"><button class="remove-img" data-i="${i}">×</button></div>`).join('');e.querySelectorAll('.remove-img').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);renderCommentPreview(id)})}

async function toggleLike(id){const exists=likes.find(x=>x.post_id===id&&x.user_id===currentUser.id);try{if(exists){const {error}=await client.from('post_likes').delete().eq('post_id',id).eq('user_id',currentUser.id);if(error)throw error}else{const {error}=await client.from('post_likes').insert({post_id:id,user_id:currentUser.id});if(error)throw error}await loadLikes();renderPosts();renderMyPage()}catch(e){toast('点赞操作失败：'+e.message)}}
async function toggleFav(id){const exists=favorites.find(x=>x.post_id===id&&x.user_id===currentUser.id);try{if(exists){const {error}=await client.from('post_favorites').delete().eq('post_id',id).eq('user_id',currentUser.id);if(error)throw error}else{const {error}=await client.from('post_favorites').insert({post_id:id,user_id:currentUser.id});if(error)throw error}await loadFavorites();renderPosts();renderMyPage()}catch(e){toast('收藏操作失败：'+e.message)}}
async function deletePost(id){if(!confirm('确定删除这条动态吗？'))return;const {error}=await client.from('posts').delete().eq('id',id);if(error){toast('删除失败：'+error.message);return}await loadAllData();renderPosts();renderMyPage();toast('已删除')}
async function deleteComment(id){if(!confirm('确定删除这条评论吗？'))return;const {error}=await client.from('comments').delete().eq('id',id);if(error){toast('删除失败：'+error.message);return}await loadAllData();renderPosts();renderMyPage();toast('已删除')}
async function sendComment(id){const input=$('ci-'+id),content=input.value.trim(),imgs=pendingCommentImages[id]||[];if(!content){toast('请输入评论文字');return}const {error}=await client.from('comments').insert({post_id:id,author_id:currentUser.id,content:content||'',images:imgs});if(error){toast('评论失败：'+error.message);return}input.value='';pendingCommentImages[id]=[];await loadAllData();renderPosts();renderMyPage();}
function openLightbox(src){$('lightboxImg').src=src;$('lightbox').classList.remove('hide')}

function switchPage(page){
  const home=page==='home';$('homePage').classList.toggle('hide',!home);$('myPage').classList.toggle('hide',home);
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));
  if(!home)renderMyPage();else renderPosts();
}
function renderMyPage(){
  if(!currentUser)return;updateUserUI();const box=$('myContentList');
  if(myTab==='posts'){const a=posts.filter(p=>p.author_id===currentUser.id);box.innerHTML=a.length?a.map(p=>`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px"><span class="tag ${catInfo(p.category).cls}">${catInfo(p.category).name}</span><button class="action delete" data-myact="delete" data-id="${p.id}">🗑️ 删除</button></div><div class="post-content" style="margin-top:10px">${esc(p.content)||'<span style="color:var(--muted)">[图片帖]</span>'}</div><div class="post-time">${fmtTime(p.created_at)}</div></div>`).join(''):'<div class="empty"><span class="emoji">📝</span>你还没有发布过帖子哦</div>';
  }else if(myTab==='comments'){const a=comments.filter(c=>c.author_id===currentUser.id);box.innerHTML=a.length?a.map(c=>`<div class="card" style="margin-bottom:12px"><div style="font-size:12px;color:var(--muted);margin-bottom:7px">回复帖子：${esc(posts.find(p=>p.id===c.post_id)?.content||'[图片帖]')}</div><div style="background:#f8fafc;border-radius:9px;padding:10px;font-size:13px;color:var(--sub)">${esc(c.content)||'[图片评论]'}</div><div style="display:flex;align-items:center;margin-top:7px"><span class="post-time">${fmtTime(c.created_at)}</span><button class="action delete" style="margin-left:auto" data-myact="delcomment" data-id="${c.id}">🗑️ 删除</button></div></div>`).join(''):'<div class="empty"><span class="emoji">💬</span>你还没有发表过评论哦</div>';
  }else{const arr=posts.filter(p=>myTab==='likes'?isLiked(p.id):isFav(p.id));box.innerHTML=arr.length?arr.map(p=>`<div class="card" style="margin-bottom:12px"><span class="tag ${catInfo(p.category).cls}">${catInfo(p.category).name}</span><div class="post-content" style="margin-top:9px">${esc(p.content)||'<span style="color:var(--muted)">[图片帖]</span>'}</div><button class="action ${myTab==='likes'?'like-on':'fav-on'}" data-myact="${myTab==='likes'?'unlike':'unfav'}" data-id="${p.id}">${myTab==='likes'?'❤️ 取消点赞':'⭐ 取消收藏'}</button></div>`).join(''):`<div class="empty"><span class="emoji">${myTab==='likes'?'❤️':'⭐'}</span>${myTab==='likes'?'你还没有点赞过帖子哦':'你还没有收藏过帖子哦'}</div>`}
  box.querySelectorAll('[data-myact="delete"]').forEach(b=>b.onclick=()=>deletePost(b.dataset.id));box.querySelectorAll('[data-myact="delcomment"]').forEach(b=>b.onclick=()=>deleteComment(b.dataset.id));box.querySelectorAll('[data-myact="unlike"]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.id));box.querySelectorAll('[data-myact="unfav"]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.id));
}

init();
</script>
</body>
</html>
